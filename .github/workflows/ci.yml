name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          pip install ruff==0.16.9
          ruff check .
      - name: Unit tests (offline; model and SEC are stubbed)
        run: python -m unittest discover -s tests -t .
