name: Real-data smoke test

on:
  schedule:
    - cron: "17 14 * * 1"  # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sectioning, XBRL revenue and transcripts against live sources (no model calls)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python smoke_real.py
